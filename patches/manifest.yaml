- id: mm/uksm
  file: 03-mm/uksm/ (17 分片)
  stage: 3
  desc: UKSM 内存去重 (17 补丁合并为单文件, brokestar233 6.6 移植)
  status: bad
  note: '已禁用 (2026-08-10): UKSM 与 ART GC 冲突 → system_server HeapTaskDaemon SIGSEGV (SEGV_ACCERR) → 死机重启。证据: KernelSU_bugreport_2026-08-10_19_45 tombstone_07 (ConcurrentCopying::ComputeLiveBytesAndMarkRefFieldsVisitor), 同机 com.xiaomi.aicr 也连续 GC SIGSEGV。ART 堆被跨进程去重后 GC 标记阶段踩坏引用。需 CONFIG_UKSM_CPU_GOVERNOR=1; 若要恢复必须排除 ART 堆 (GKI 上难以精确排除, 建议保持关闭)'
