name: GetManager

# 从 ReSukiSU-Ultra 仓库拉取管理器 APK (公开 release, 匿名可下载)
# 注意: 需要 ReSukiSU-Ultra 仓库先打 tag (v*) 触发 release 发布

permissions:
  contents: write

on:
  workflow_call:

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: 下载管理器 APK (ReSukiSU-Ultra 最新 release)
        continue-on-error: true
        run: |
          mkdir -p manager
          # latest/download 直连 (固定资产名, 无需 API 不触发限流)
          curl -sL "https://github.com/pengzenzen-creator/ReSukiSU-Ultra/releases/latest/download/ReSukiSU-Ultra-universal.apk" -o manager/ReSukiSU-Ultra-universal.apk
          ls -la manager/
          # 校验是否真的下载到 (404 页面会是一个小文件)
          SIZE=$(stat -c %s manager/ReSukiSU-Ultra-universal.apk)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::warning::管理器 APK 下载失败 (可能无 release), 跳过"
            rm -f manager/ReSukiSU-Ultra-universal.apk
          fi

      - name: 上传管理器 APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-apk
          path: manager/*.apk
          if-no-files-found: warn
