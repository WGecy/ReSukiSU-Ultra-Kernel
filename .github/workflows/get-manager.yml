name: GetManager

# 从 ReSukiSU-Ultra 仓库拉取管理器 APK (公开 release, 匿名可下载)
# 注意: 需要 ReSukiSU-Ultra 仓库先打 tag (v*) 触发 release 发布

permissions:
  contents: write

on:
  workflow_call:

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          # 换源: azure.archive.ubuntu.com CDN 偶发卡死 → archive.ubuntu.com
          sudo sed -i 's|azure\\.archive\\.ubuntu\\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y curl jq

      - name: 下载管理器 APK (ReSukiSU-Ultra 最新 release)
        continue-on-error: true
        run: |
          mkdir -p manager
          # 一个版本一个 tag: 用 API 拿最新 release 的 tag (按创建时间, 含 prerelease)
          LATEST_TAG=$(curl -s "https://api.github.com/repos/pengzenzen-creator/ReSukiSU-Ultra/releases?per_page=1" | jq -r '.[0].tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::warning::无法获取最新 release, 跳过"
            exit 0
          fi
          echo "最新管理器版本: $LATEST_TAG"
          curl -sL "https://github.com/pengzenzen-creator/ReSukiSU-Ultra/releases/download/${LATEST_TAG}/ReSukiSU-Ultra-universal.apk" -o manager/ReSukiSU-Ultra-universal.apk
          ls -la manager/
          # 校验是否真的下载到 (404 页面会是一个小文件)
          SIZE=$(stat -c %s manager/ReSukiSU-Ultra-universal.apk)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::warning::管理器 APK 下载失败 (可能无 release), 跳过"
            rm -f manager/ReSukiSU-Ultra-universal.apk
          fi

      - name: 上传管理器 APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-apk
          path: manager/*.apk
          if-no-files-found: warn
