# ========================================
# ReSukiSU-Ultra 内核构建核心工作流
# 完全参照 GKI_KernelSU_SUSFS 构建流程:
#   1. 环境准备
#   2. repo init + sync (kernel manifest, 含 kleaf tools/bazel)
#   3. 功能补丁 (patches.py)
#   4. build.py (SUSFS/KSU 注入 + defconfig + bazel + AK3)
# ========================================
name: 内核构建流程

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: "main"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "N"
      enable_susfs:
        required: false
        type: boolean
        default: true
      use_bbg:
        required: false
        type: boolean
        default: false
      use_zram:
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: true

jobs:
  build-kernel:
    name: "6.6.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-ReSukiSU-Ultra"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "        ReSukiSU-Ultra 内核构建"
          echo "========================================"
          echo "内核版本  : ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
          echo "补丁级别  : ${{ inputs.os_patch_level }}"
          echo "KSU 分支  : ReSukiSU-Ultra (${{ inputs.ksu_branch }})"
          echo "SUSFS     : ${{ inputs.enable_susfs }}"
          echo "ZRAM 增强 : ${{ inputs.use_zram }}"
          echo "CVE 修复  : ${{ inputs.cve_2026_43499_patch }}"
          echo "========================================"

      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: 检出代码仓库
        uses: actions/checkout@v7

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-yaml git curl \
            build-essential libssl-dev bison flex libelf-dev dwarves \
            openssl zip unzip bc kmod cpio jq openjdk-17-jdk-headless ccache

      - name: 配置构建参数
        run: |
          python3 - << 'EOF'
          import yaml
          with open('config.yaml') as f:
              cfg = yaml.safe_load(f)
          cfg['build']['android_version'] = '${{ inputs.android_version }}'
          cfg['build']['kernel_version'] = '${{ inputs.kernel_version }}'
          cfg['build']['kernel_base'] = '${{ inputs.kernel_version }}.${{ inputs.sub_level }}'
          cfg['build']['os_patch_level'] = '${{ inputs.os_patch_level }}'
          cfg['build']['lts_merge'] = False
          if '${{ inputs.build_time }}' != '' and '${{ inputs.build_time }}' != 'N':
              cfg['build']['build_time'] = '${{ inputs.build_time }}'
          cfg['susfs']['enabled'] = ${{ inputs.enable_susfs && 'True' || 'False' }}
          cfg['features']['bbg'] = ${{ inputs.use_bbg && 'True' || 'False' }}
          cfg['features']['zram_lz4kd'] = ${{ inputs.use_zram && 'True' || 'False' }}
          cfg['features']['cve_fix'] = ${{ inputs.cve_2026_43499_patch && 'True' || 'False' }}
          cfg['features']['lts_fixes'] = False
          with open('config.yaml', 'w') as f:
              yaml.dump(cfg, f, allow_unicode=True)
          print('config.yaml 已更新')
          EOF

      # ==================== 拉取内核源码 (参考 GKI_KernelSU_SUSFS) ====================
      - name: 初始化并同步内核源码
        run: |
          set -e
          mkdir -p build/repo
          cd build/repo

          # repo 工具 (gerrit v2.16, 支持 --repo-rev)
          curl -s "https://gerrit.googlesource.com/git-repo/+/refs/tags/v2.16/repo?format=TEXT" | base64 -d > repo
          chmod +x repo

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            FORMATTED_BRANCH="android15-6.6-2025-03"
            MANIFEST_BRANCH="common-android15-6.6-2025-03"
          else
            FORMATTED_BRANCH="android15-6.6-2026-01"
            MANIFEST_BRANCH="common-android15-6.6-2026-01"
          fi

          echo "repo init: ${MANIFEST_BRANCH}"
          ./repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${MANIFEST_BRANCH} --repo-rev=v2.16

          # deprecated 分支处理 (6.6.77: common revision 加 deprecated/ 前缀)
          if [ "${{ inputs.sub_level }}" == "77" ]; then
            sed -i 's/revision="android15-6.6-2025-03"/revision="deprecated\/android15-6.6-2025-03"/' .repo/manifests/default.xml
            echo "manifest: common -> deprecated/android15-6.6-2025-03"
          fi

          echo "repo sync..."
          ./repo sync -c -j$(nproc --all) --no-tags --fail-fast

          # 确认 common remote 为 aosp (build.py 依赖)
          git -C common remote -v | head -2
          test -f common/Makefile && echo "common/Makefile OK"

      # ==================== 构建 (build.py: 补丁/KSU/SUSFS/defconfig/bazel/AK3) ====================
      - name: 运行 build.py
        run: |
          python3 build.py

      - name: 上传内核产物
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-${{ inputs.android_version }}
          path: out/*.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.zip
          fail_on_unmatched_files: true
