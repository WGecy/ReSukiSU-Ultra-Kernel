# ========================================
# ReSukiSU-Ultra 内核构建核心工作流
# 完全参照 GKI_KernelSU_SUSFS: bash 显式步骤, 不依赖 build.py
#   1. 环境准备
#   2. repo init + sync (kernel manifest)
#   3. KernelSU (ReSukiSU-Ultra) 集成
#   4. SUSFS (gitlab 上游)
#   5. 功能补丁 (patches.py 模块)
#   6. defconfig + fragment
#   7. bazel 构建
#   8. AK3 打包
# ========================================
name: 内核构建流程

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: "main"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "N"
      enable_susfs:
        required: false
        type: boolean
        default: true
      use_bbg:
        required: false
        type: boolean
        default: false
      use_zram:
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: true

jobs:
  build-kernel:
    name: "6.6.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-ReSukiSU-Ultra"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "        ReSukiSU-Ultra 内核构建"
          echo "========================================"
          echo "内核版本  : ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
          echo "补丁级别  : ${{ inputs.os_patch_level }}"
          echo "KSU 分支  : ReSukiSU-Ultra (${{ inputs.ksu_branch }})"
          echo "SUSFS     : ${{ inputs.enable_susfs }}"
          echo "========================================"

      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/microsoft /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: 检出代码仓库
        uses: actions/checkout@v7

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-yaml git curl \
            build-essential libssl-dev bison flex libelf-dev dwarves \
            openssl zip unzip bc kmod cpio jq openjdk-17-jdk-headless ccache

      # ==================== bazel 磁盘缓存 (提速关键, 参考 GKI_KernelSU_SUSFS) ====================
      - name: 恢复 bazel 磁盘缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.os_patch_level }}
          restore-keys: |
            bazel-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-

      # ==================== 拉取内核源码 (repo manifest, 参考 GKI_KernelSU_SUSFS) ====================
      - name: 初始化并同步内核源码
        run: |
          set -e
          mkdir -p build/repo
          cd build/repo

          curl -s "https://gerrit.googlesource.com/git-repo/+/refs/tags/v2.16/repo?format=TEXT" | base64 -d > repo
          chmod +x repo

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            FORMATTED_BRANCH="android15-6.6-2025-03"
            MANIFEST_BRANCH="common-android15-6.6-2025-03"
          else
            FORMATTED_BRANCH="android15-6.6-2026-01"
            MANIFEST_BRANCH="common-android15-6.6-2026-01"
          fi

          echo "repo init: ${MANIFEST_BRANCH}"
          ./repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${MANIFEST_BRANCH} --repo-rev=v2.16

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            sed -i 's/revision="android15-6.6-2025-03"/revision="deprecated\/android15-6.6-2025-03"/' .repo/manifests/default.xml
            echo "manifest: common -> deprecated/android15-6.6-2025-03"
          fi

          echo "repo sync..."
          ./repo sync -c -j$(nproc --all) --no-tags --fail-fast
          git -C common remote -v | head -2
          test -f common/Makefile && echo "common/Makefile OK"

      # ==================== 添加 KernelSU (ReSukiSU-Ultra) ====================
      - name: 添加 KernelSU (ReSukiSU-Ultra)
        run: |
          set -e
          cd build/repo
          # 克隆 ReSukiSU-Ultra 分支
          git clone --depth 1 https://github.com/pengzenzen-creator/ReSukiSU-Ultra KernelSU
          cd KernelSU
          git checkout ${{ inputs.ksu_branch }}
          echo "KSU commit: $(git rev-parse --short HEAD)"
          cd ..

          # 集成到内核树 (setup.sh 逻辑)
          cd common/drivers
          ln -sf "$(realpath --relative-to=. ../../KernelSU/kernel)" kernelsu
          grep -q "kernelsu" Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> Makefile
          grep -q "drivers/kernelsu/Kconfig" Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" Kconfig
          echo "KernelSU 集成完成"

      # ==================== 应用 SUSFS (gitlab 上游) ====================
      - name: 应用 SUSFS
        if: ${{ inputs.enable_susfs }}
        run: |
          set -e
          cd build/repo
          # gitlab simonpunk 上游
          git clone --depth 1 -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          echo "SUSFS commit: $(git -C susfs4ksu log -1 --format='%H')"

          # 应用补丁 (参考 build.py step05e)
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cp -r susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          cd common
          patch -p1 -F 3 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          echo "SUSFS 补丁应用完成"

      # ==================== 应用功能补丁 (patches.py 模块) ====================
      - name: 应用功能补丁
        run: |
          python3 - << 'EOF'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, '.')
          from patches import apply_all
          cfg = yaml.safe_load(open('config.yaml'))
          # 依据输入覆盖 features
          cfg['features']['bbg'] = ${{ inputs.use_bbg && 'True' || 'False' }}
          cfg['features']['zram_lz4kd'] = ${{ inputs.use_zram && 'True' || 'False' }}
          cfg['features']['cve_fix'] = ${{ inputs.cve_2026_43499_patch && 'True' || 'False' }}
          cfg['features']['lts_fixes'] = False
          cfg['build']['lts_merge'] = False
          apply_all(cfg, Path('build/repo'), sublevel='${{ inputs.sub_level }}', kernel_base='${{ inputs.kernel_version }}.${{ inputs.sub_level }}')
          print('功能补丁应用完成')
          EOF

      # ==================== CVE-2026-43499 修复链 ====================
      - name: 应用 CVE 修复
        if: ${{ inputs.cve_2026_43499_patch }}
        working-directory: build/repo/common
        run: |
          ACTUAL_SUB=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          bash $GITHUB_WORKSPACE/third_party/security_patch/apply_cve_2026_43499.sh \
            ${{ inputs.kernel_version }} "$ACTUAL_SUB" $GITHUB_WORKSPACE/third_party/security_patch
          echo "CVE 修复完成 (SUBLEVEL=$ACTUAL_SUB)"

      # ==================== defconfig + fragment (参考 GKI_KernelSU_SUSFS: enable_config 检查 Kconfig) ====================
      - name: 生成 defconfig + fragment
        working-directory: build/repo/common
        run: |
          set -e
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          FRAG=arch/arm64/configs/tesla.fragment

          # 备份原始 defconfig (fragment 通过 diff 生成)
          cp $DEFCONFIG $DEFCONFIG.orig

          # enable_config: 已启用跳过 / not set 原位替换 / 不存在追加
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  已启用: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  已切换: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  已添加: $cfg"
            fi
          }

          # 仅启用 Kconfig 已声明的项 (避免 savedefconfig 不匹配)
          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  跳过 (Kconfig 未声明): $cfg"
            fi
          }

          # KSU / 功能项
          enable_config_if_defined CONFIG_KSU
          enable_config_if_defined CONFIG_KSU_NETISOLATE
          enable_config_if_defined CONFIG_KSU_FUSEBPF_FIX
          # ipset 全家桶
          for c in CONFIG_IP_SET CONFIG_IP_SET_BITMAP_IP CONFIG_IP_SET_BITMAP_IPMAC CONFIG_IP_SET_BITMAP_PORT CONFIG_IP_SET_HASH_IP CONFIG_IP_SET_HASH_IPMARK CONFIG_IP_SET_HASH_IPPORT CONFIG_IP_SET_HASH_IPPORTIP CONFIG_IP_SET_HASH_IPPORTNET CONFIG_IP_SET_HASH_MAC CONFIG_IP_SET_HASH_NET CONFIG_IP_SET_HASH_NETIFACE CONFIG_IP_SET_HASH_NETNET CONFIG_IP_SET_HASH_NETPORT CONFIG_IP_SET_HASH_NETPORTNET CONFIG_IP_SET_LIST_SET CONFIG_NETFILTER_XT_SET; do
            enable_config_if_defined $c
          done
          # ADIOS IO 调度器 (choice 项原位处理)
          enable_config_if_defined CONFIG_MQ_IOSCHED_ADIOS
          if config_defined CONFIG_MQ_IOSCHED_DEFAULT_ADIOS; then
            sed -i 's/^CONFIG_MQ_IOSCHED_DEFAULT_[A-Z_]*=y$/CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y/' $DEFCONFIG
            grep -q '^CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y' $DEFCONFIG || echo 'CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y' >> $DEFCONFIG
          fi

          # SUSFS 配置 (参考 GKI_KernelSU_SUSFS)
          if [ "${{ inputs.enable_susfs }}" == "true" ]; then
            cat >> $DEFCONFIG << 'SUSFS_EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          SUSFS_EOF
            echo "SUSFS CONFIG 已追加"
          fi

          # 生成 fragment (diff defconfig vs .orig, 参考 GKI_KernelSU_SUSFS)
          diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > $FRAG || true
          # 还原 defconfig (fragment 作为增量, 避免 trim 检查)
          cp $DEFCONFIG.orig $DEFCONFIG
          echo "fragment 生成: $(wc -l < $FRAG) 项"
          head -40 $FRAG

      # ==================== 编译内核 (kleaf bazel, 参考 GKI_KernelSU_SUSFS) ====================
      - name: 编译内核
        run: |
          set -e
          cd build/repo
          # 关闭 savedefconfig 校验 (check_defconfig) 与 KMI 严格模式
          sed -i 's/check_defconfig//' common/build.config.gki
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64
          tools/bazel build --disk_cache=/home/runner/.cache/bazel \
            --config=fast --lto=thin \
            --defconfig_fragment=//common:arch/arm64/configs/tesla.fragment \
            //common:kernel_aarch64_dist
          test -f bazel-bin/common/kernel_aarch64/Image && echo "Image OK"

      # ==================== 打包 AK3 ====================
      - name: 打包 AnyKernel3
        run: |
          set -e
          mkdir -p out/ak3
          cp -r third_party/AnyKernel3/* out/ak3/
          cp build/repo/bazel-bin/common/kernel_aarch64/Image out/ak3/
          cd out/ak3
          zip -q -r ../android15-6.6.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip .
          ls -la ../*.zip

      - name: 上传内核产物
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-${{ inputs.android_version }}
          path: out/*.zip
          if-no-files-found: error

      # ==================== 自动发布 Release (gh CLI, 无第三方依赖) ====================
      - name: 删除旧 Release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          gh release delete kernel-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }} \
            --repo ${{ github.repository }} --yes --cleanup-tag || true

      - name: 发布 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create kernel-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }} \
            out/*.zip \
            --repo ${{ github.repository }} \
            --title "ReSukiSU-Ultra-Kernel ${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}" \
            --notes "自动构建内核产物 (ReSukiSU-Ultra 分支)\n版本: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}"
